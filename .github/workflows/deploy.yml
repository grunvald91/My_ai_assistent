name: Deploy bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Superagent server-side prepare tests (offline)
        run: bash test/superagent-prepare.test.sh
      - name: Superagent relay and shell syntax tests (offline)
        run: |
          bash -n scripts/superagent-prepare-worktree.sh scripts/superagent-terminal-relay.sh scripts/superagent-capability-heartbeat.sh
          node --check scripts/superagent-configure-prompts.mjs
          node --check scripts/superagent-pr-watch-core.mjs
          node --check scripts/superagent-external-pr-monitor.mjs
          bash test/superagent-terminal-relay.test.sh

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    env:
      TGCLOUD_TOKEN: ${{ secrets.TELEGRAM_CLI_ACCESS }}
      CLAUDEHUB_API_KEY: ${{ secrets.CLAUDEHUB_API_KEY }}
      OWNER_IDS: ${{ secrets.OWNER_IDS || vars.OWNER_IDS }}
      GH_PAT: ${{ secrets.GH_PAT }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      YANDEX_RASP_API_KEY: ${{ secrets.YANDEX_RASP_API_KEY }}
      YANDEX_API: ${{ secrets.YANDEX_API }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy (push, safe migrate, webhook)
        run: npm run deploy
