name: Deploy bot

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      TGCLOUD_TOKEN: ${{ secrets.TELEGRAM_CLI_ACCESS }}
      CLAUDEHUB_API_KEY: ${{ secrets.CLAUDEHUB_API_KEY }}
      OWNER_IDS: ${{ secrets.OWNER_IDS || vars.OWNER_IDS }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy (push, safe migrate, webhook)
        run: npm run deploy
