name: Validate ClaudeHub DeepSeek V4.1 and Opus 5.5
on:
  push:
    branches: [ops/dsh-vps157-preflight-20261103]
    paths: ['.github/workflows/dsh-claudehub-smoke.yml']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLAUDEHUB_API_KEY: ${{ secrets.CLAUDEHUB_API_KEY }}
      DSH_CLAUDE_SMOKE_MODEL: claude-opus-5-5
      DSH_CHAT_SMOKE_MODEL: deepseek-v4.1-flash
    steps:
      - uses: actions/checkout@v4
      - name: Verify ClaudeHub Messages and Chat Completions
        run: python3 scripts/dsh-claudehub-smoke.py
