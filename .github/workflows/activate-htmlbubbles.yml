name: Activate HTMLBubbles when Serverless supports Bot API 10.4

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

# Coordinate with the normal main-branch deploy. Do not deploy in parallel.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      supported: ${{ steps.detect.outputs.supported }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Serverless handler support without credentials
        id: detect
        run: node scripts/check-widget-capabilities.mjs

  activate:
    needs: probe
    if: needs.probe.outputs.supported == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TGCLOUD_TOKEN: ${{ secrets.TELEGRAM_CLI_ACCESS }}
      CLAUDEHUB_API_KEY: ${{ secrets.CLAUDEHUB_API_KEY }}
      OWNER_IDS: ${{ secrets.OWNER_IDS || vars.OWNER_IDS }}
      GH_PAT: ${{ secrets.GH_PAT }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      YANDEX_RASP_API_KEY: ${{ secrets.YANDEX_RASP_API_KEY }}
      YANDEX_API: ${{ secrets.YANDEX_API }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Deploy with verified webhook and widget attestation
        run: npm run deploy
