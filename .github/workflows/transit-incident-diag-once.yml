name: Transit incident diagnostics (one-off read-only)
on:
  push:
    branches: [ops/transit-incident-diag-20261104]
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TGCLOUD_TOKEN: ${{ secrets.TELEGRAM_CLI_ACCESS }}
      CLAUDEHUB_API_KEY: ${{ secrets.CLAUDEHUB_API_KEY }}
      OWNER_IDS: ${{ secrets.OWNER_IDS || vars.OWNER_IDS }}
      GH_PAT: ${{ secrets.GH_PAT }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Fetch sanitized production diagnostic (no chat texts)
        run: |
          node scripts/write-secrets.mjs
          OWNER="${OWNER_IDS%%,*}"
          npx tgcloud run endpoints/diag "{ bgtest: 'no' }" --ctx "{ initData: { user: { id: ${OWNER} } } }" > /tmp/transit-diagnostic.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw = fs.readFileSync('/tmp/transit-diagnostic.txt','utf8');
          const lines = raw.split(/\r?\n/);
          const relevant = lines.filter((line) => /transit_intent_fail|llm_fail|chat_model|ago_s:|reason:|kind:|model:|status:|error:|last_messages/.test(line));
          console.log('SANITIZED RUNTIME DIAGNOSTIC:');
          console.log(relevant.slice(0,130).join('\n'));
          NODE
