name: Tutu station and MCP schema check (one-off read-only)
on:
  push:
    branches: [ops/transit-incident-diag-20261104]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check provider tool names and station aliases, no train times
        run: |
          node --input-type=module <<'NODE'
          import { callTutuTool } from './tgcloud/lib/transit.js';
          const url = 'https://mcp.tutu.ru/mcp';
          const start = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json, text/event-stream'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'initialize',params:{protocolVersion:'2025-11-25',capabilities:{},clientInfo:{name:'review',version:'1.0'}}})});
          const init = await start.json();
          const session = start.headers.get('mcp-session-id');
          const headers = {'Content-Type':'application/json','Accept':'application/json, text/event-stream',...(session?{'Mcp-Session-Id':session}:{}),'MCP-Protocol-Version':init.result?.protocolVersion??'2025-11-25'};
          await fetch(url,{method:'POST',headers,body:JSON.stringify({jsonrpc:'2.0',method:'notifications/initialized'})});
          const tr = await fetch(url,{method:'POST',headers,body:JSON.stringify({jsonrpc:'2.0',id:2,method:'tools/list'})});
          const mime = tr.headers.get('content-type')||'';
          const txt = await tr.text();
          const json = mime.includes('event-stream') ? JSON.parse(txt.split('\n').find(x=>x.startsWith('data:')).slice(5)) : JSON.parse(txt);
          console.log('AVAILABLE TOOLS:',JSON.stringify((json.result?.tools??[]).map(t=>({name:t.name,required:t.inputSchema?.required??[]}))));
          const checks = [
            ['search_etrain','Адлер','Красная Поляна','2026-11-04'],
            ['search_etrain','Адлер','Роза Хутор','2026-11-04'],
            ['search_etrain','Адлер','Роза Хутор','2026-11-05'],
            ['search_etrain','Сочи','Адлер','2026-11-04'],
            ['search_rail','Москва','Тверь','2026-11-05'],
          ];
          for(const [tool,origin,destination,date] of checks) {
            const controller = new AbortController();
            const timer = setTimeout(()=>controller.abort(),20000);
            try {const d=await callTutuTool((u,o)=>fetch(u,{...o,signal:controller.signal}),tool,{origin,destination,date});
              console.log('RESULT',JSON.stringify({tool,origin,destination,date,count:d.offers?.length??null,
                from:d.meta?.from,to:d.meta?.to,total_matched:d.meta?.total_matched,
                total_returned:d.meta?.total_returned,non_etrain_dropped:d.meta?.upstream_non_etrain_dropped,
                metaComplete:d.meta?.complete}));
            } catch(e) {console.log('ERROR',JSON.stringify({tool,origin,destination,date,error:String(e.message??e).slice(0,120)}));}
            finally{clearTimeout(timer)}
          }
          NODE
