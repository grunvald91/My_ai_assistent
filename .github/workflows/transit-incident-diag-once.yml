name: Transit provider live smoke (one-off read-only)
on:
  push:
    branches: [ops/transit-incident-diag-20261104]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: One live Tutu MCP request (do not publish train data)
        run: |
          node --input-type=module <<'NODE'
          import { callTutuTool } from './tgcloud/lib/transit.js';
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 35000);
          const date = new Intl.DateTimeFormat('en-CA', { timeZone:'Europe/Moscow', year:'numeric',month:'2-digit',day:'2-digit' }).format(new Date());
          try {
            const data = await callTutuTool((url,opts) => fetch(url,{...opts,signal:controller.signal}),
              'search_etrain',{origin:'Адлер',destination:'Красная Поляна',date});
            const entries = Array.isArray(data.offers) ? data.offers : [];
            console.log(JSON.stringify({date, success:true, topLevelKeys:Object.keys(data).slice(0,20), offers:entries.length,
              firstOfferKeys: Object.keys(entries[0]??{}).slice(0,30), metaKeys:Object.keys(data.meta??{}).slice(0,20)},null,2));
          } catch(e) {
            console.log('Tutu smoke error:',String(e.message??e).slice(0,200));
            process.exitCode=1;
          } finally {clearTimeout(timeout)}
          NODE
