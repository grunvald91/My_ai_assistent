name: Tutu live response parsing smoke (one-off read-only)
on:
  push:
    branches: [ops/transit-incident-diag-20261104]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Read-only provider schema without publishing train times
        run: |
          node --input-type=module <<'NODE'
          import { callTutuTool, normalizeDepartures } from './tgcloud/lib/transit.js';
          const requests = [
            ['search_etrain','Сочи','Адлер','2026-11-04'],
            ['search_rail','Адлер','Роза Хутор','2026-11-05'],
          ];
          for (const [kind,origin,destination,date] of requests) {
            const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),45000);
            try {
              const data=await callTutuTool((u,o)=>fetch(u,{...o,signal:ctl.signal}),kind,{origin,destination,date});
              const now=Date.parse('2026-11-04T00:00:00+03:00')/1000;
              const valid=normalizeDepartures(data,{origin,destination,date,timezoneHours:3},now);
              console.log('SCHEMA',JSON.stringify({kind,origin,destination,date,rawCount:data.offers?.length??null,validCount:valid.length,
                firstOfferKeys:Object.keys(data.offers?.[0]??{}),
                departureAtType:typeof data.offers?.[0]?.departure_at,
                departureDateTimeType:typeof data.offers?.[0]?.departure_datetime,
                departureType:typeof data.offers?.[0]?.departure,
                firstOfferFromType:typeof data.offers?.[0]?.from,
                firstOfferToType:typeof data.offers?.[0]?.to},null,2));
            }catch(e){console.log('ERROR',kind,String(e.message??e).slice(0,140));}
            finally{clearTimeout(t)}
          }
          NODE
