name: DSH reliable first-task intake
on:
  push:
    branches: [ops/dsh-vps157-preflight-20261103]
    paths: [.github/workflows/dsh-reliable-intake.yml]
permissions:
  contents: read
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      SSH_KEY_157: ${{ secrets.SSH_KEY_157 }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable repository Issue polling with explicit-only gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/dsh-reliable-github-intake.py
          umask 077
          K=$(mktemp); H=$(mktemp)
          trap 'rm -f "$K" "$H"' EXIT
          printf '%s\n' "$SSH_KEY_157" | tr -d '\r' > "$K"
          ssh-keyscan -T 8 -t ed25519 157.22.203.28 2>/dev/null > "$H"
          [ "$(ssh-keygen -lf "$H" | awk '{print $2}')" = 'SHA256:rqV4WQmGpDXUI5mcxFuE4L++gnMbIXlnpS/pqkHMw8U' ]
          ssh -i "$K" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$H" root@157.22.203.28 'python3 -' < scripts/dsh-reliable-github-intake.py
