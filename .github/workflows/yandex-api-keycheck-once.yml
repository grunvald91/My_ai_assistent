name: Tutu MCP multimodal schema inspection
on:
  push:
    branches: [ops/yandex-api-keycheck-20261104]
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect public Tutu MCP tools (no secret data)
        run: |
          node --input-type=module <<'NODE'
          const url='https://mcp.tutu.ru/mcp';
          const post=async(body,headers={})=>{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json, text/event-stream',...headers},body:JSON.stringify(body)});const t=await r.text();let j=null;try{j=JSON.parse(t)}catch{const s=t.split('\n').find(x=>x.startsWith('data:'));if(s)j=JSON.parse(s.slice(5))}return {r,j}};
          const a=await post({jsonrpc:'2.0',id:1,method:'initialize',params:{protocolVersion:'2025-11-25',capabilities:{},clientInfo:{name:'schema-test',version:'1'}}});
          const h={...(a.r.headers.get('mcp-session-id')?{'Mcp-Session-Id':a.r.headers.get('mcp-session-id')}:{})};
          await post({jsonrpc:'2.0',method:'notifications/initialized'},h);
          const b=await post({jsonrpc:'2.0',id:2,method:'tools/list'},h);
          for(const t of b.j?.result?.tools??[])if(['search_etrain','search_rail','search_bus','search_avia','search_multitransport'].includes(t.name)){
            console.log(JSON.stringify({tool:t.name,required:t.inputSchema?.required,props:Object.fromEntries(Object.entries(t.inputSchema?.properties??{}).map(([k,v])=>[k,{type:v.type,enum:v.enum,default:v.default}]))}));
          }
          NODE
