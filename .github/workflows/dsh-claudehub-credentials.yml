name: DSH ClaudeHub catalog + agent login
on:
  workflow_dispatch:
  push:
    branches: [ops/dsh-vps157-preflight-20261103]
    paths: ['.github/workflows/dsh-claudehub-credentials.yml']
permissions:
  contents: read
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSH_KEY_157: ${{ secrets.SSH_KEY_157 }}
      CLAUDEHUB_API_KEY: ${{ secrets.CLAUDEHUB_API_KEY }}
      AGENT_GH_PAT: ${{ secrets.AGENT_GH_PAT }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate and transfer model discovery utility
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/dsh-claudehub-refresh-models.py
          umask 077
          k="$(mktemp)"
          known="$(mktemp)"
          trap 'rm -f "$k" "$known"' EXIT
          printf '%s\n' "$SSH_KEY_157" | tr -d '\r' > "$k"
          ssh-keyscan -T 8 -t ed25519 157.22.203.28 2>/dev/null > "$known"
          [ "$(ssh-keygen -lf "$known" | awk '{print $2}')" = 'SHA256:rqV4WQmGpDXUI5mcxFuE4L++gnMbIXlnpS/pqkHMw8U' ]
          ssh_opts=(-i "$k" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=10)
          scp "${ssh_opts[@]}" scripts/dsh-claudehub-refresh-models.py root@157.22.203.28:/srv/dsh-agent/config/refresh_claudehub_models.py
          ssh "${ssh_opts[@]}" root@157.22.203.28 'chown dsh-agent:dsh-agent /srv/dsh-agent/config/refresh_claudehub_models.py; chmod 0700 /srv/dsh-agent/config/refresh_claudehub_models.py'
          if [ -n "${CLAUDEHUB_API_KEY:-}" ]; then
            if [[ "$CLAUDEHUB_API_KEY" == *$'\n'* || "$CLAUDEHUB_API_KEY" == *$'\r'* ]]; then echo 'CLAUDEHUB_KEY_FORMAT_INVALID'; exit 12; fi
            printf 'CLAUDEHUB_API_KEY=%s\n' "$CLAUDEHUB_API_KEY" |
              ssh "${ssh_opts[@]}" root@157.22.203.28 'umask 077; cat > /srv/dsh-agent/.dsh/.env; chown dsh-agent:dsh-agent /srv/dsh-agent/.dsh/.env; chmod 0600 /srv/dsh-agent/.dsh/.env'
            ssh "${ssh_opts[@]}" root@157.22.203.28 \
              'runuser -u dsh-agent -- env HOME=/srv/dsh-agent DSH_HOME=/srv/dsh-agent/.dsh PATH=/opt/dsh-toolchain/bin:/usr/bin:/bin python3 /srv/dsh-agent/config/refresh_claudehub_models.py'
          else
            echo 'CLAUDEHUB_API_KEY_MISSING: provider routes configured, catalog sync deferred'
          fi
          if [ -n "${AGENT_GH_PAT:-}" ]; then
            printf '%s' "$AGENT_GH_PAT" |
              ssh "${ssh_opts[@]}" root@157.22.203.28 \
              'runuser -u dsh-agent -- env HOME=/srv/dsh-agent GH_CONFIG_DIR=/srv/dsh-agent/.config/gh-agent PATH=/opt/dsh-toolchain/bin:/usr/bin:/bin /opt/dsh-toolchain/bin/gh auth login --hostname github.com --with-token'
            login="$(ssh "${ssh_opts[@]}" root@157.22.203.28 'runuser -u dsh-agent -- env HOME=/srv/dsh-agent PATH=/opt/dsh-toolchain/bin:/usr/bin:/bin /srv/dsh-agent/.local/bin/gh-agent api user --jq .login')"
            test "${login,,}" = 'grunvald1991' || { echo 'GITHUB_ACCOUNT_MISMATCH'; exit 13; }
            echo 'AGENT_GITHUB_LOGIN_VERIFIED=Grunvald1991'
          else
            echo 'AGENT_GH_PAT_MISSING: separate GitHub login deferred'
          fi
          echo 'CLAUDEHUB_AND_AGENT_CREDENTIAL_PROVISIONING_COMPLETE'
