name: Diagnostics

# Ручной запуск (Actions → Diagnostics → Run workflow): заглядывает в бота на серверах Telegram и печатает отчёт
# без текстов переписки: замеры доступа к ClaudeHub и GitHub, зависшие апдейты, ошибки и время вызовов ИИ из журнала.
on:
  workflow_dispatch:
    inputs:
      bgtest: { description: 'фоновый ответ через Actions: no | yes | big (большой запрос ~3 МБ); 1-й запуск стартует, 2-й сообщает итог', required: false, default: 'no', type: choice, options: ['no', 'yes', 'big'] }

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      TGCLOUD_TOKEN: ${{ secrets.TELEGRAM_CLI_ACCESS }}
      CLAUDEHUB_API_KEY: ${{ secrets.CLAUDEHUB_API_KEY }}
      OWNER_IDS: ${{ secrets.OWNER_IDS || vars.OWNER_IDS }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Report
        run: |
          node scripts/write-secrets.mjs
          OWNER="${OWNER_IDS%%,*}"
          npx tgcloud run endpoints/diag "{ bgtest: '${{ inputs.bgtest }}' }" --ctx "{ initData: { user: { id: ${OWNER} } } }"
      - name: Probe handler (чужой пользователь, ничего владельцу не отправляется)
        if: always()
        run: |
          npx tgcloud run handlers/message '{ message_id: 1, date: 1, chat: { id: 1, type: "private" }, from: { id: 1, first_name: "diag" }, text: "/id" }' --ctx '{ update: { update_id: 1 } }' || true
      - name: Webhook
        if: always()
        run: npx tgcloud webhook || true
