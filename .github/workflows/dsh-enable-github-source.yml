name: DSH enable GitHub issue intake (first repo)
on:
  push:
    branches: [ops/dsh-vps157-preflight-20261103]
    paths: [.github/workflows/dsh-enable-github-source.yml]
permissions:
  contents: read
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSH_KEY_157: ${{ secrets.SSH_KEY_157 }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure agent source and validate live runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/dsh-activate-github-source.py
          umask 077
          K=$(mktemp); H=$(mktemp)
          trap 'rm -f "$K" "$H"' EXIT
          printf '%s\n' "$SSH_KEY_157" | tr -d '\r' > "$K"
          ssh-keyscan -T 8 -t ed25519 157.22.203.28 2>/dev/null > "$H"
          [ "$(ssh-keygen -lf "$H" | awk '{print $2}')" = 'SHA256:rqV4WQmGpDXUI5mcxFuE4L++gnMbIXlnpS/pqkHMw8U' ]
          ssh -i "$K" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$H" root@157.22.203.28 'python3 -' < scripts/dsh-activate-github-source.py
      - name: Verify EUNOIA remains reachable
        run: |
          curl -fsS -o /dev/null -w 'EUNOIA_HTTP=%{http_code}\n' --max-time 18 https://spokoino.site/
