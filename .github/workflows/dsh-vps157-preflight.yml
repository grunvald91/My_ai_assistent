name: DSH VPS157 preflight (one-off read-only)
on:
  push:
    branches: [ops/dsh-vps157-preflight-20261103]
    paths: ['.github/workflows/dsh-vps157-preflight.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SSH_KEY_157: ${{ secrets.SSH_KEY_157 }}
    steps:
      - name: Verify secret and read-only SSH server report
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY_157:-}" ]; then echo 'RESULT: SSH_KEY_157 is missing or empty'; exit 11; fi
          umask 077
          KEYFILE="$(mktemp)"
          trap 'rm -f "$KEYFILE"' EXIT
          printf '%s\n' "$SSH_KEY_157" | tr -d '\r' > "$KEYFILE"
          unset SSH_KEY_157
          if ! ssh-keygen -y -P "" -f "$KEYFILE" >/dev/null 2>&1; then
            echo 'RESULT: SSH_KEY_157 exists but is not a usable unencrypted SSH private key'; exit 12
          fi
          echo 'RESULT: SSH_KEY_157 exists and parses as an SSH private key'
          echo 'TARGET: 157.22.203.28:22 (root)'
          echo 'HOST KEY OBSERVED (not yet pinned independently):'
          ssh-keyscan -T 7 -p 22 157.22.203.28 2>/dev/null | ssh-keygen -lf - 2>/dev/null | head -3 || true
          ssh -i "$KEYFILE" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o ConnectionAttempts=1 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 root@157.22.203.28 'bash -s' <<'REMOTE'
          set -u
          echo '--- SERVER ID ---'
          hostname; uname -srm
          printf 'OS: '; (grep '^PRETTY_NAME=' /etc/os-release || true) | head -1
          echo '--- RESOURCES ---'
          date -u '+UTC %Y-%m-%d %H:%M:%S'
          uptime
          nproc
          free -h
          df -hP / /var /opt /srv 2>/dev/null || df -hP /
          echo '--- DISK INODES ---'
          df -iP /
          echo '--- DNS MATCH ---'
          getent ahostsv4 spokoino.site 2>/dev/null | awk '$2=="STREAM" {print $1}' | sort -u | head -10 || true
          echo '--- HTTP SERVICE / DOMAIN REFERENCE ---'
          for dir in /etc/nginx/sites-enabled /etc/nginx/conf.d /etc/caddy /etc/apache2/sites-enabled; do
            [ ! -d "$dir" ] || grep -RIlm1 -E 'spokoino[.]site|Психолог в кармане' "$dir" 2>/dev/null | head -12 || true
          done
          echo '--- SOFTWARE ---'
          for pkg in node pnpm git python3 tmux gh dsh docker; do
            printf '%s: ' "$pkg"
            if command -v "$pkg" >/dev/null 2>&1; then
              case "$pkg" in
                node|pnpm|git|python3|tmux|gh|dsh) "$pkg" --version 2>&1 | head -1 ;;
                docker) docker --version 2>&1 | head -1 ;;
              esac
            else echo 'missing'; fi
          done
          echo '--- RUNNING CONTAINERS (names/status only) ---'
          if command -v docker >/dev/null 2>&1; then docker ps --format '{{.Names}}  {{.Status}}' 2>/dev/null | head -25 || true; fi
          echo '--- LISTENING PORTS ---'
          ss -lntH 2>/dev/null | awk '{print $4}' | sort -u | head -30 || true
          echo '--- TOP RESOURCE USERS (command names, no arguments) ---'
          ps -eo comm,rss --sort=-rss 2>/dev/null | head -13 || true
          echo '--- HOSTING DIRS (names only) ---'
          for dir in /opt /srv /var/www; do
            [ ! -d "$dir" ] || find "$dir" -mindepth 1 -maxdepth 1 -type d -printf '%p\n' 2>/dev/null | head -30
          done
          echo '=== RAM DETAIL ==='
          grep -E '^(MemTotal|MemAvailable|SwapTotal|SwapFree|Cached|SReclaimable|Shmem|AnonPages|Slab):' /proc/meminfo
          echo '=== MEMORY PRESSURE ==='
          cat /proc/pressure/memory 2>/dev/null || true
          echo '=== CONTAINER MEMORY ==='
          timeout 35 docker stats --no-stream --format '{{.Name}} | {{.MemUsage}} | {{.MemPerc}} | {{.CPUPerc}}' || true
          echo '=== SWAP BY PROCESS (kB name only) ==='
          for x in /proc/[0-9]*/status; do
            awk '/^Name:/{name=$2} /^VmSwap:/{if($2>0) print $2, name}' "$x" 2>/dev/null || true
          done | sort -nr | head -20 || true
          echo '=== DOCKER SPACE ==='
          timeout 35 docker system df || true
          echo '=== DIRECTORY SPACE ==='
          for p in /var /opt /root /var/lib/docker /var/log /opt/eunoia /opt/eunoia-deploy-backups; do
            echo "DIRECTORY $p"
            timeout 45 du -xhd1 "$p" 2>/dev/null | sort -h | tail -15 || true
          done
          echo '=== DOCKER LOG SIZES (names only) ==='
          for id in $(docker ps -aq); do
            name="$(docker inspect -f '{{.Name}}' "$id" | sed 's#^/##')"
            logpath="$(docker inspect -f '{{.LogPath}}' "$id")"
            if [ -n "$logpath" ] && [ -f "$logpath" ]; then
              stat -c '%s bytes' "$logpath" 2>/dev/null | sed "s/$/ $name/" || true
            fi
          done
          echo '=== JOURNAL SIZE ==='
          journalctl --disk-usage 2>/dev/null || true
          echo '=== BINDINGS (without env/secrets) ==='
          docker ps --format '{{.Names}}: {{.Ports}}'
          echo '=== SERVER READ-ONLY AUDIT COMPLETE ==='
          echo '=== LARGE SYSTEM AREAS (disk use) ==='
          for p in /var/lib /var/lib/containerd /var/backups /opt/eunoia/web /opt/eunoia/data; do
            echo "SECTION $p"
            timeout 35 du -xhd1 "$p" 2>/dev/null | sort -h | tail -18 || true
          done
          echo '=== BACKUP FILE SUMMARY (sizes dates only; no names/content) ==='
          find /var/backups -xdev -type f -printf '%s %TY-%Tm-%Td\n' 2>/dev/null | sort -nr | head -20 || true
          echo '=== JOURNAL HISTORY AND RETENTION ==='
          journalctl --list-boots --no-pager 2>/dev/null | head -20 || true
          grep -hE '^[[:space:]]*(SystemMaxUse|SystemKeepFree|SystemMaxFileSize|MaxRetentionSec)=' /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*.conf 2>/dev/null || true
          echo '=== PROJECT FILE METADATA (no file contents) ==='
          if [ -d /opt/eunoia/.git ]; then
            git -C /opt/eunoia status --porcelain 2>/dev/null | wc -l
            git -C /opt/eunoia branch --show-current 2>/dev/null || true
            git -C /opt/eunoia rev-parse --short HEAD 2>/dev/null || true
            printf 'origin matches GitHub EUNOIA: '
            if git -C /opt/eunoia config --get remote.origin.url 2>/dev/null | grep -q 'grunvald91/EUNOIA'; then echo yes; else echo unknown; fi
          fi
          echo '=== IMPORTANT APPLICATION STORAGE (sizes only) ==='
          for p in /opt/eunoia/data/books /opt/eunoia/data/vosk /opt/eunoia/web/.next /opt/eunoia/web/node_modules; do
            [ ! -d "$p" ] || du -sh "$p" 2>/dev/null || true
          done
          echo '=== DOCKER VOLUMES (names only) ==='
          docker volume ls --format '{{.Name}}' | head -30 || true
          echo '=== TOTAL PERSISTENT DOCKER VOLUME DATA ==='
          timeout 25 du -sh /var/lib/docker/volumes /var/lib/containerd 2>/dev/null || true
          echo '=== TOP HIDDEN DISK CONSUMERS FILE SIZES (path masked) ==='
          find /var/log /var/backups /opt/eunoia -xdev -type f -size +100M -printf '%s bytes\n' 2>/dev/null | sort -nr | head -20 || true
          echo '=== END TARGETED READ-ONLY AUDIT ==='
          echo '=== DETAILED MEMORY ACCOUNTING ==='
          free -w -h
          grep -E '^(MemTotal|MemFree|MemAvailable|Cached|Buffers|SReclaimable|SUnreclaim|Slab|KernelStack|PageTables|AnonPages|Shmem|SwapCached|SwapTotal|SwapFree):' /proc/meminfo
          vmstat 1 3 | tail -4
          echo '=== TOP PROCESSES PROPORTIONAL MEMORY (kB) ==='
          for stat in /proc/[0-9]*/smaps_rollup; do
            pid="$(basename "$(dirname "$stat")")"
            [ -r "$stat" ] || continue
            pss="$(awk '/^Pss:/{print $2; exit}' "$stat" 2>/dev/null || true)"
            [ -n "$pss" ] || continue
            name="$(cat "/proc/$pid/comm" 2>/dev/null || true)"
            printf '%s %s\n' "$pss" "$name"
          done | sort -nr | head -30 || true
          echo '=== BACKUP FILE FORMATS AND AGE (metadata only) ==='
          find /var/backups/eunoia -type f -printf '%s %TY-%Tm-%Td %p\n' 2>/dev/null | sort -nr | head -8 | while read -r size date path; do
            printf 'bytes=%s date=%s format=%s\n' "$size" "$date" "$(file -b "$path" 2>/dev/null | cut -c 1-90)"
          done
          echo '=== REPOSITORY DRIFT COUNTS ==='
          git -C /opt/eunoia diff --name-only | wc -l
          git -C /opt/eunoia diff --cached --name-only | wc -l
          git -C /opt/eunoia ls-files --others --exclude-standard | wc -l
          echo '=== CHANGED CODE PATHS (excluding sensitive names) ==='
          git -C /opt/eunoia diff --name-only | grep -Ev '(^|/)(\.env|secret|credential|private|id_)' | head -65 || true
          echo '=== FILE CHANGE ROOTS ==='
          git -C /opt/eunoia status --porcelain -uall | cut -c 4- | awk -F/ '{print $1}' | sort | uniq -c | sort -nr | head -20 || true
          echo '=== CONTAINER RESTART / OOM ==='
          docker inspect -f '{{.Name}} OOM={{.State.OOMKilled}} restarts={{.RestartCount}}' $(docker ps -aq) || true
          echo '=== END READ-ONLY AUDIT ==='
          echo 'RESULT: SSH audit completed (no changes made)'
          REMOTE
