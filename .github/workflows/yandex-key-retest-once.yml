name: Yandex Timetables actual thread schema check
on:
  push:
    branches: [ops/yandex-key-retest-20261104]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      YANDEX_API: ${{ secrets.YANDEX_API }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect Adler-Rosa search and thread field shapes safely
        run: |
          node --input-type=module <<'NODE'
          const key=(process.env.YANDEX_API||'').trim();if(!key)throw new Error('Missing key');
          const base='https://api.rasp.yandex-net.ru/v3.0/';
          const get=async(path,params)=>{const qs=new URLSearchParams({format:'json',lang:'ru_RU',...params});const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),15000);try{const r=await fetch(base+path+'?'+qs,{headers:{Authorization:key},signal:ctl.signal});return {status:r.status,body:await r.json()}}finally{clearTimeout(t)}};
          const plan={from:'s9613054',to:'s9812791',date:'2026-11-05',transport_types:'suburban',limit:'1',transfers:'false'};
          const a=await get('search/',plan);const first=a.body?.segments?.[0];
          console.log('SEARCH',JSON.stringify({status:a.status,count:a.body?.pagination?.total??null,
            departureType:typeof first?.departure,arrivalType:typeof first?.arrival,
            codeFrom:first?.from?.code,codeTo:first?.to?.code,
            stationFrom:first?.from?.title,stationTo:first?.to?.title,
            threadType:first?.thread?.transport_type,uidType:typeof first?.thread?.uid,
            durationType:typeof first?.duration,hasTransfers:first?.has_transfers,
            carrierType:typeof first?.thread?.carrier?.title}));
          if(first?.thread?.uid){const t=await get('thread/',{uid:first.thread.uid,from:plan.from,to:plan.to,date:plan.date});
            console.log('THREAD',JSON.stringify({status:t.status,stopCount:t.body?.stops?.length??null,
              firstStopKeys:Object.keys(t.body?.stops?.[0]??{}),
              firstStationTitleType:typeof t.body?.stops?.[0]?.station?.title,
              firstStopArrivalType:typeof t.body?.stops?.[0]?.arrival}));}
          NODE