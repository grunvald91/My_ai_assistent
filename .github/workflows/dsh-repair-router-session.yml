name: DSH repair preserved router model session
on:
  push:
    branches: [ops/dsh-vps157-preflight-20261103]
    paths: [.github/workflows/dsh-repair-router-session.yml]
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_KEY_157: ${{ secrets.SSH_KEY_157 }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify script and rotate only inactive stale router Session
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/dsh-rotate-orchestrator-session.py
          umask 077
          K=$(mktemp); H=$(mktemp)
          trap 'rm -f "$K" "$H"' EXIT
          printf '%s\n' "$SSH_KEY_157" | tr -d '\r' > "$K"
          ssh-keyscan -T 8 -t ed25519 157.22.203.28 2>/dev/null > "$H"
          [ "$(ssh-keygen -lf "$H" | awk '{print $2}')" = 'SHA256:rqV4WQmGpDXUI5mcxFuE4L++gnMbIXlnpS/pqkHMw8U' ]
          ssh -i "$K" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$H" root@157.22.203.28 'python3 -' < scripts/dsh-rotate-orchestrator-session.py
      - name: Verify unrelated EUNOIA remains online
        run: curl -fsS --max-time 15 -o /dev/null -w 'EUNOIA_HTTP=%{http_code}\n' https://spokoino.site/
